<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Relay</title>
    <script>
      // Restore the last style before first paint (App.tsx writes this cache
      // once the data file loads); without it the default flashes first.
      try {
        var cached = JSON.parse(localStorage.getItem('relay.style') || 'null');
        if (cached && cached.style) {
          var root = document.documentElement;
          root.dataset.style = cached.style;
          root.style.colorScheme = cached.scheme;
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute('content', cached.scheme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
